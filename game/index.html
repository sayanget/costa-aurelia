<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Costa Aurelia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0d14'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23f2c66d'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d14; font-family: "Segoe UI", Arial, sans-serif; }
  #viewport { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #overlay { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #overlay.hidden { display: none; }
  #overlay { background: radial-gradient(ellipse at center, rgba(20,24,34,0.35), rgba(5,6,10,0.75)); }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .panel { background: rgba(12,14,20,0.92); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
    padding: 30px 36px; width: min(92vw, 440px); color: #e8edf4; text-align: center; box-shadow: 0 24px 70px rgba(0,0,0,0.55); }
  .panel h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: 3px; color: #f2c66d; }
  .panel .tag { margin: 0 0 20px; color: #9aa4b2; font-size: 12.5px; line-height: 1.5; }
  .btn { display: block; width: 100%; margin: 8px 0; padding: 11px 16px; background: #2a3344; color: #f2e9da;
    border: 1px solid rgba(255,255,255,0.14); border-radius: 7px; font-size: 15px; cursor: pointer; }
  .btn:hover { background: #394562; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.primary { background: #c9742f; border-color: #e59a52; }
  .btn.primary:hover { background: #dd8a3f; }
  .hints { margin-top: 18px; font-size: 11.5px; color: #7e8795; line-height: 1.7; text-align: left; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 12px 0; font-size: 13px; color: #cfd6e0; }
  .row input[type=range] { flex: 1; margin-left: 12px; }
</style>
</head>
<body>
<canvas id="viewport" aria-label="Costa Aurelia: an open-world coastal crime game"></canvas>
<canvas id="hud"></canvas>
<div id="overlay"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
